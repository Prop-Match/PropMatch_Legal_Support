[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "propmatch-legal-support"
version = "0.1.0"
description = "FastAPI RAG service for PropMatch Egyptian real-estate legal support"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-chroma>=1.0,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT>=2.9,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
legal-support-ingest = "app.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
