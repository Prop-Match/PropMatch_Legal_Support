services:
  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    ports:
      - "8001:8001"
    depends_on:
      - chroma

volumes:
  chroma_data:
